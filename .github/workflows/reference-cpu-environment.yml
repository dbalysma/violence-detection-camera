name: Reference CPU environment verification

on:
  pull_request:
    paths:
      - requirements-reference-py313.txt
      - "**.py"
      - .github/workflows/reference-cpu-environment.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reference-cpu:
    name: Install and smoke-test Python 3.13 CPU reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use an empty Torch cache so offline tests can't find pretrained weights
        run: echo "TORCH_HOME=$RUNNER_TEMP/empty-torch-home" >> "$GITHUB_ENV"
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Record interpreter version
        run: python --version
      - name: Install official CPU PyTorch and Torchvision wheels
        run: python -m pip install --no-cache-dir torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned reference dependencies
        run: python -m pip install --no-cache-dir -r requirements-reference-py313.txt
      - name: Verify imports, package versions, and R(2+1)D-18 construction
        run: python -m tools.verify_reference_environment
      - name: Run the full test suite, including offline PyTorch smoke tests
        run: python -m unittest discover -s tests -v
