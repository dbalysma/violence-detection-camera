name: Evaluation regression checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stdlib-tests:
    name: Syntax and evaluation I/O (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every Python file without importing ML dependencies
        run: python -m compileall -q *.py tests tools
      - name: Run pure-standard-library regression tests
        run: python -m unittest discover -s tests -v
